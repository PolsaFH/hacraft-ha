name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly, to notice when a new Home Assistant release breaks something

jobs:
  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compile every module
        run: python -m compileall -q custom_components
      - name: History helpers
        run: python tests/test_history.py
